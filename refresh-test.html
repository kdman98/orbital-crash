<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>rAF refresh test</title>
<style>
 html,body{margin:0;height:100%;background:#070b16;color:#eaf2ff;
   font:600 16px/1.4 -apple-system,system-ui,sans-serif;
   display:flex;align-items:center;justify-content:center;text-align:center}
 #hz{font-size:clamp(48px,18vw,120px);font-weight:800;letter-spacing:-.03em;line-height:1}
 #ms{font-size:clamp(16px,5vw,28px);color:#38e0ff;margin-top:.3em}
 #v{margin-top:1.2em;font-size:clamp(13px,3.6vw,18px);max-width:22em;color:#8494ba}
 b{color:#eaf2ff}
</style></head><body><div>
<div id="hz">…</div><div id="ms">sampling</div><div id="v">Leave this on screen for a few seconds.</div>
</div><script>
// Pure rAF interval sampling. NOTHING is drawn per frame on purpose: the whole point is that a frame
// with no work still cannot beat the display's refresh period, so whatever this reports IS the ceiling.
var iv=[],prev=0,N=240;
function q(a,p){return a[Math.floor((a.length-1)*p)]}
function tick(now){
  if(prev)iv.push(now-prev);
  prev=now;
  if(iv.length>=N){
    var s=iv.slice().sort(function(a,b){return a-b}),med=q(s,.5),min=q(s,0);
    document.getElementById('hz').textContent=Math.round(1000/med)+' Hz';
    document.getElementById('ms').textContent=med.toFixed(2)+' ms median · '+min.toFixed(2)+' ms fastest';
    document.getElementById('v').innerHTML = med<11
      ? '<b>120Hz.</b> This browser reaches ProMotion.'
      : (min<11 ? '<b>Mixed.</b> Fastest frame beat 11ms, median did not — adaptive throttling.'
                : '<b>60Hz.</b> Not one frame in '+N+' beat 11ms — a hard cap.');
    iv=[];
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script></body></html>
