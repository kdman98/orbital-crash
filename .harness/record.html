<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORBITAL CRASH — record a run</title>
<style>
  html,body{margin:0;height:100%;background:#060814;color:#cfe6ff;
            font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  /* Column flex, NOT `position:fixed; inset:0 0 34px 0`. An <iframe> is a REPLACED element: with
     height:auto it takes its intrinsic 300x150 and ignores `bottom` entirely, where a normal element
     would stretch. That silently handed the game a 150px-tall window, so it computed S=150/800=0.1875
     and built a 6827-unit-wide world — a giant clipped title over an empty field. Flex also keeps the
     bar's height in ONE place instead of repeating 34px here as a magic number. */
  body{display:flex;flex-direction:column}
  #frame{flex:1 1 auto;min-height:0;width:100%;border:0;display:block}
  #bar{flex:none;height:34px;display:flex;align-items:center;gap:10px;
       padding:0 10px;background:#0b1024;border-top:1px solid #1d2a4d;box-sizing:border-box}
  #dot{width:9px;height:9px;border-radius:50%;background:#e0345a;flex:none;animation:p 1.4s infinite}
  @keyframes p{50%{opacity:.25}}
  #stat{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8fa8cc}
  button{font:inherit;color:#cfe6ff;background:#16224a;border:1px solid #2b3d70;border-radius:5px;
         padding:3px 11px;cursor:pointer}
  button:hover{background:#1e2c5c}
  button:disabled{opacity:.4;cursor:default}
  b{color:#6fe3ff;font-weight:600}
</style>
</head>
<body>
<iframe id="frame" title="ORBITAL CRASH"></iframe>
<div id="bar">
  <span id="dot"></span>
  <span id="stat">booting…</span>
  <button id="save" disabled>Save tape</button>
  <button id="again" disabled>New run</button>
</div>
<script type="module">
// Record a real human run as an input tape.
//
// The game runs in an iframe whose document we rewrite so preload.js gets in ahead of the game's own
// script — that is the only way to capture its rAF callback, and capturing it is what lets the tape
// carry grid-aligned frame timings that replay can reproduce exactly.
//
// Audio stays ON by default: the Capacitor-full chime and the inhale swell are information you play by,
// and a tape recorded in silence is a tape of someone playing a different game. The cost is that
// noise() draws from the same Math.random stream the simulation uses (~24,000 draws per Collapse), so a
// sound-on tape replays to draw-count granularity rather than bit-exactly until that is fixed.
// Add ?silent=1 to record a bit-exact tape instead.
const BASE = new URL('../', location.href).pathname;
const silent = new URLSearchParams(location.search).has('silent');
const $ = id => document.getElementById(id);
const stat = (h) => { $('stat').innerHTML = h; };

let n = 0;
const fresh = u => fetch(u + (u.includes('?') ? '&' : '?') + 'h=' + (++n) + '_' + (performance.now() | 0),
                        { cache: 'reload' }).then(r => { if (!r.ok) throw new Error(u + ' → ' + r.status); return r.text(); });

const fnv = s => { let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i);
    h ^= c & 0xff; h = Math.imul(h, 16777619) >>> 0; h ^= (c >> 8) & 0xff; h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16).padStart(8, '0'); };

let W, H, G, REC, t0;

async function boot() {
  // THE SERVICE WORKER MUST NOT BE BETWEEN US AND THE GAME. sw.js is network-first for .html, but on a
  // failed fetch it falls back to `caches.match('./index.html')` — the copy precached at install. So if
  // the dev server is down (or blips) the recorder is handed a stale shell and tapes it WITHOUT ANY
  // ERROR. That is not hypothetical: the first two tapes ever recorded both carry build c76dd415, a
  // build several commits old, because the server had died between sessions. Two runs of real play were
  // spent measuring a game that no longer existed, and the only reason it was caught is that every tape
  // carries a build hash.
  // Unregistering makes every fetch below go straight to the network, so a dead server produces a loud
  // boot failure instead of a quiet lie. The SW keeps intercepting until the page reloads, hence the
  // reload. Recording needs the dev server anyway, so nothing is lost by not being offline-capable here.
  if (navigator.serviceWorker) {
    const regs = await navigator.serviceWorker.getRegistrations();
    if (regs.length) {
      stat('a service worker was intercepting fetches — unregistering and reloading…');
      await Promise.all(regs.map(r => r.unregister()));
      location.reload();
      return;
    }
  }
  stat('fetching…');
  // Harness files must be cache-busted: sw.js is cache-first for everything that is not .html.
  const [src, pre, rec] = await Promise.all([
    fresh(BASE + 'index.html'), fresh(BASE + '.harness/preload.js'), fresh(BASE + '.harness/record.js')]);

  // Write into a BLANK document. Pointing f.src at index.html first booted the game a SECOND time:
  // document.open() reuses the same Window, so instance #1 (loaded without preload) survived the
  // rewrite, and once preload replaced requestAnimationFrame its re-registration landed in the same
  // single-slot H.pending and clobbered the real loop. The surviving instance then drew to the
  // DISCARDED document's canvas — an empty field, a frozen 0:00 HUD, and diag() reporting `play` from
  // the other instance while nothing ever stepped. Measured: 600 hand-pumped frames produced 0 steps
  // and 0 RNG draws. about:blank has no base URL of its own, so <base> is what keeps the game's own
  // relative URLs (manifest, icons) resolving to its directory rather than to .harness/.
  // No src and no onload wait: the iframe already holds an about:blank document, and assigning
  // src='about:blank' fires `load` during the assignment, before a handler can catch it — a hang.
  // "New run" re-enters here; document.open() resets whatever the previous run wrote.
  const f = $('frame');

  const d = f.contentDocument;
  d.open();
  d.write(src.replace(/<head>/i,
    '<head>\n<base href="' + BASE + '">\n<script>\n' + pre + '\n<' + '/script>'));
  d.close();

  W = await new Promise((res, rej) => { let i = 0;
    const c = () => { const cw = f.contentWindow;
      if (cw && cw.__H && cw.__orbital && cw.__H.pending) return res(cw);
      if (++i > 250) return rej(new Error('game never registered a frame callback'));
      setTimeout(c, 20); };
    c(); });

  H = W.__H; G = W.__orbital;
  H.build = fnv((src.match(/<script>([\s\S]*?)<\/script>/) || [])[1] || '');
  W.eval(rec);
  REC = W.__REC;

  if (silent) H.stubAudio();
  H.pumpLive();                                   // real-clock frames, quantized on the way in
  REC.start({ audioStubbed: silent });
  t0 = performance.now();

  $('save').disabled = false; $('again').disabled = false;
  f.contentWindow.focus();
  tick();
}

// THE STATUS BAR MUST NOT COMPETE WITH THE GAME. This ran every rAF: it called diag() (which allocates
// and walks the enemy array), reduced over EVERY row recorded so far to re-count events — an O(frames)
// scan that grows without bound, so by frame 6000 it was re-summing 6000 rows sixty times a second — and
// then wrote innerHTML, forcing an HTML parse plus layout in the parent document while the game rendered
// 3420x1684 in the iframe next to it. A recorder that steals frames from the thing it is recording makes
// every frame-time number in the tape a measurement of the recorder.
//
// 4Hz instead, with the event count carried as a running total rather than recomputed. The number on
// screen is a progress indicator a human glances at, and nobody reads it sixty times a second.
const UI_HZ = 4;
let uiNext = 0, evCount = 0, evRows = 0;

function tick(now = 0) {
  if (REC && now >= uiNext) {
    uiNext = now + 1000 / UI_HZ;
    const d = G.diag(), fr = REC.rows.length;
    for (; evRows < fr; evRows++) evCount += REC.rows[evRows][1].length;   // incremental, not a re-scan
    const p = REC.rows.length > 60 ? REC.rows[fr - 1][0] / H.Q : 0;
    stat(`seed <b>${REC.header.seed}</b> · build <b>${H.build}</b> · ${silent ? 'silent' : 'sound on'}` +
         ` — <b>${fr}</b> frames, <b>${evCount}</b> events, ${(fr / 60).toFixed(1)}s` +
         ` · state <b>${d.state}</b> score <b>${d.score}</b> · <b>${p ? (1000 / p).toFixed(0) : '–'}</b>fps` +
         (d.state === 'dead' ? ' — <b>save it</b>' : ''));
  }
  requestAnimationFrame(tick);
}

$('save').onclick = () => {
  const tape = REC.stop();
  const name = `tape-${tape.seed}-${tape.end.state}-${Math.round(tape.end.t)}s.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(tape)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
  stat(`saved <b>${name}</b> — ${tape.frames.length} frames. Put it in <b>orbital-crash/tapes/</b>. Press "New run" to record another.`);
};

$('again').onclick = () => { $('save').disabled = true; $('again').disabled = true; boot(); };

boot().catch(e => { stat('<b>boot failed:</b> ' + e.message); $('dot').style.background = '#666'; });
</script>
</body>
</html>
